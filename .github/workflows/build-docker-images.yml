name: Build docker images (CI / dev / prod)
on:
    push:
      tags:
          - '**'
    # Manual launch from the Actions tab, on any branch or tag
    workflow_dispatch:
      inputs:
        image:
          description: Images to build and push
          type: choice
          default: dev-prod
          options:
            - dev-prod
            - dev
            - prod
            - builder

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-CI-docker-image:
    ## Deploy new CI image only if master changes, or on manual request
    if: ${{ github.ref == 'master' || inputs.image == 'builder' }}
    uses: ./.github/workflows/workflow-docker-image.yml
    with:
      image_name: builder
      target: explorer_ws_builder
    secrets: inherit

  build-and-push-dev-docker-image:
    if: ${{ github.event_name == 'push' || inputs.image == 'dev-prod' || inputs.image == 'dev' }}
    uses: ./.github/workflows/workflow-docker-image.yml
    with:
      image_name: dev
      target: explorer_ws_dev
    secrets: inherit

  pull-private-repositories:
    if: ${{ github.event_name == 'push' || inputs.image == 'dev-prod' || inputs.image == 'prod' }}
    uses: ./.github/workflows/workflow-pull-private-repositories.yml
    secrets: inherit

  build-and-push-prod-docker-image:
    needs: pull-private-repositories
    uses: ./.github/workflows/workflow-docker-image.yml
    with:
      image_name: prod
      target: explorer_ws_prod
      artifact_name: pull-private-repositories-explorer-ws
    secrets: inherit